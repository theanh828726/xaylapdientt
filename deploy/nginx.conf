# Nginx cho TuyếnSố: HTTPS, phục vụ frontend đã build và chuyển /api tới backend. Thay tuyenso.example.vn bằng tên miền thật.
limit_req_zone $binary_remote_addr zone=dangnhap:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name tuyenso.example.vn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tuyenso.example.vn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    # Bản đồ lấy tile từ tile.openstreetmap.org; nếu đổi VITE_MAP_TILES_URL thì thêm nguồn tile vào img-src/connect-src.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' https://tile.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 25m;           # ảnh hiện trường, KMZ (backend giới hạn KMZ 20 MB)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/auth/login {
        limit_req zone=dangnhap burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params.conf;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
